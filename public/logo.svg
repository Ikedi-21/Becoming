<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Becoming Logo: Rising sun above two ascending geometric forms -->
  <defs>
    <linearGradient id="sunGlow" x1="24" y1="4" x2="24" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E7B66B" />
      <stop offset="100%" stop-color="#65C9B8" />
    </linearGradient>
  </defs>
  
  <!-- Rising Sun (semicircular/circular core) -->
  <circle cx="24" cy="14" r="7" fill="url(#sunGlow)" />
  
  <!-- Left Ascending Geometric Form -->
  <path d="M8 40 L20 23 L25 23 L13 40 Z" fill="#65C9B8" />
  
  <!-- Right Ascending Geometric Form (Higher / Becoming) -->
  <path d="M23 40 L37 17 L42 17 L28 40 Z" fill="#A7C4A0" />
</svg>
